<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沙漠之鹰 · 外观组件交互</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#dfe1e4;color:#535e50;font:12px system-ui,sans-serif}main{height:100%;display:flex;flex-direction:column}#stage{position:relative;flex:1;min-height:280px;touch-action:none}canvas{display:block;width:100%;height:100%;outline:none}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:10px 16px 8px}button{font:12px system-ui,sans-serif;background:transparent;border:1px solid #bdc6b6;border-radius:3px;padding:9px 15px;min-height:38px;color:inherit;cursor:pointer}button:hover{background:#dfe5d8}button:focus-visible{outline:2px solid #778e68;outline-offset:3px}.hint{text-align:center;padding:2px 16px 22px;color:#8a9382;font-size:11px;line-height:1.8}#loading{position:absolute;inset:0;display:grid;place-content:center;color:#7e8978;pointer-events:none}#error{display:none;text-align:center;padding:30px;font-size:14px}a{color:inherit}@media(max-width:480px){.hint{padding-bottom:15px;font-size:10px}button{padding:8px 11px}.controls{gap:5px}}

</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><main><div id="stage"><div id="loading">正在加载三维本体…</div><div id="error"></div></div><div class="mechanics"><button id="slideAction">拉动套筒</button><button id="dragAction" aria-pressed="false">拖动套筒模式</button><button id="hammerAction">转动击锤</button><button id="magazineAction">移出弹匣</button><button id="tourAction" aria-pressed="false">自动演示</button><button id="restoreAction">动作复原</button></div><div class="mechanics"><button id="stepOut">打开一层</button><button id="stepIn">合上一层</button><button id="explodeAction">全部展开</button></div><div class="ranges"><label>套筒<input id="slideRange" aria-label="套筒位移" type="range" min="0" max="100" value="0"></label><label>展开<input id="explodeRange" aria-label="展开程度" type="range" min="0" max="100" value="0"></label><span id="motionStatus" role="status">已归位</span></div><div class="controls"><button id="reset">参考视角</button><button id="referenceToggle">参考图</button><button id="left">左侧</button><button id="right">右侧</button><button id="top">顶部</button><button id="front">正面</button></div><div class="hint">拖动旋转 · 滚轮 / 双指缩放 · 方向键旋转<br>外观组件展示 · 可在动作中反向切换 · 展开时暂停套筒动作</div><img id="reference" src="./reference.png" alt="用户提供的外观参考图" style="display:none;position:fixed;top:16px;right:16px;width:min(300px,50vw);border:1px solid #bbc0c1;border-radius:3px"/></main><script type="module" src="./main.js"></script></body></html>
