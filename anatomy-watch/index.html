function spiral(turns,radius,phase=0){return Array.from({length:160},(_,i)=>{const t=i/159,a=t*TAU*turns+phase,r=1.5+t*radius;return(i?'L':'M')+(Math.cos(a)*r).toFixed(3)+','+(Math.sin(a)*r).toFixed(3);}).join('');}
function panel(){ $('hours').textContent=(reserve/3600).toFixed(1);$('reserve').style.width=reserve/(48*3600)*100+'%';$('pause').textContent=running?'Ⅱ 暂停机芯':'▶ 启动机芯';$('status').textContent=reserve<=0?'动力耗尽，请上链':running?'机芯运转中':'机芯已暂停';$('speed-label').textContent=speed===1?'观察速度 · 真实走时':'观察速度 · '+speed+' 倍速演示';}
function draw(force=false){const second=Math.floor(simulation/1000);if(force||second!==lastReadout){$('time').textContent=timeFmt.format(simulation);$('date').textContent=dateFmt.format(simulation)+' · 上海时间';panel();lastReadout=second;}const t=Math.floor((simulation+8*3600000)/200)*.2;
$('hourHand').setAttribute('transform',`rotate(${t/120%360})`);$('minuteHand').setAttribute('transform',`rotate(${t/10%360})`);$('secondHand').setAttribute('transform',`rotate(${t*6%360})`);
if(!reduced.matches||force){gears.forEach((g,i)=>{const deg=g.escape?Math.floor(phase*5)*12:phase/g.period*360*g.dir;$('gear'+i).setAttribute('transform',`rotate(${deg%360})`);});const angle=Math.sin(phase*TAU*2.5)*105;$('balanceWheel').setAttribute('transform',`rotate(${angle})`);$('hairspring').setAttribute('d',spiral(3.7+angle/360,15,angle*Math.PI/180));$('mainSpring').setAttribute('d',spiral(2.8+reserve/172800*2,9));}}
function advance(now){const elapsed=Math.max(0,(now-last)/1000);last=now;if(running){const dt=Math.min(elapsed*speed,reserve);simulation+=dt*1000;phase+=dt;reserve=Math.max(0,reserve-dt);if(reserve===0)running=false;}}
function tick(now){frame=0;advance(now);if(!reduced.matches||Math.floor(now/1000)!==lastStill){draw();lastStill=Math.floor(now/1000);}if(visible&&!document.hidden)frame=requestAnimationFrame(tick);}
function wake(){if(!frame&&visible&&!document.hidden)frame=requestAnimationFrame(tick);}
$('pause').onclick=()=>{advance(performance.now());if(!running&&reserve<=0){$('status').textContent='请先上紧发条';return;}running=!running;panel();draw(true);};
$('wind').onclick=()=>{advance(performance.now());reserve=Math.min(172800,reserve+43200);panel();draw(true);if(!reduced.matches)$('crownArt').animate([{filter:'brightness(1)'},{filter:'brightness(1.6)'},{filter:'brightness(1)'}],{duration:450});};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{advance(performance.now());speed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(el=>el.setAttribute('aria-pressed',Number(el.dataset.speed)===speed));panel();});
$('sync').onclick=()=>{advance(performance.now());simulation=Date.now();speed=1;document.querySelectorAll('[data-speed]').forEach(el=>el.setAttribute('aria-pressed',Number(el.dataset.speed)===1));draw(true);};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();$('pause').click();}});
new IntersectionObserver(es=>{visible=es[0].isIntersecting;if(!visible&&frame){cancelAnimationFrame(frame);frame=0;}else wake();}).observe(document.querySelector('.workbench'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&frame){cancelAnimationFrame(frame);frame=0;}else wake();});
draw(true);wake();
</script></body></html>
