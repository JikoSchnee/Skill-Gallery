<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机械表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3ed;color:#354737;font-family:system-ui,sans-serif}main{max-width:900px;margin:auto;padding:12px 20px 28px}.stage{max-width:720px;margin:auto}.stage svg{display:block;width:100%;max-height:calc(100svh - 140px);min-height:300px}.controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:4px auto 0}button{font:12px system-ui,sans-serif;padding:9px 13px;min-height:38px;background:transparent;border:1px solid #b8c3ad;border-radius:3px;color:#42583b;cursor:pointer}button:hover,button[aria-pressed=true]{background:#e1e7d8}button:focus-visible{outline:2px solid #718e5e;outline-offset:3px}.speeds{display:flex;gap:4px}.speeds button{min-width:40px;padding:9px 8px}.readout{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:13px 0 0;font-size:11px;color:#7a8572;font-variant-numeric:tabular-nums}.readout time{letter-spacing:1px}#reserve,#date,#speed-label{display:none}@media(max-width:480px){main{padding:8px 12px 22px}.stage svg{max-height:70svh}.controls{max-width:350px}button{padding:9px 11px}}
</style></head><body><main><div class="workbench"><div class="stage"><!--WATCH--></div><div class="controls"><button id="wind">↻ 上链</button><button id="pause">Ⅱ 暂停</button><div class="speeds" role="group" aria-label="观察速度"><button data-speed="0.25" aria-pressed="false">¼×</button><button data-speed="1" aria-pressed="true">1×</button><button data-speed="5" aria-pressed="false">5×</button></div><button id="sync">同步当前时间</button></div><div class="readout"><time id="time">00:00:00</time><span>动力 <span id="hours">36.0</span> / 48 h</span><span id="status">机芯运转中</span></div><span id="reserve"></span><span id="date"></span><span id="speed-label"></span></div></main><script>/*RUNTIME*/</script></body></html>
